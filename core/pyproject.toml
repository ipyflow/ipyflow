[build-system]
requires = [
    'setuptools >= 48',
    'wheel >= 0.30.0',
    'setuptools-git-versioning',
]
build-backend = 'setuptools.build_meta'

[tool.setuptools-git-versioning]
enabled = true

[tool.black]
line-length = 88
target-version = ['py39']
extend-exclude = '(^/ipyflow/__init__|^/versioneer|_version)\.py'

[tool.isort]
profile = 'black'
extend_skip_glob = [
    '**/ipyflow/__init__.py',
    '**/versioneer.py',
    '**/_version.py',
    '**/setup.py',
]

[tool.ruff]
extend-exclude = ['versioneer.py', '_version.py']

[tool.ruff.lint]
# Pin to ruff's classic default rule set so an unpinned ruff upgrade in CI
# doesn't start enforcing rules the project handles elsewhere (isort/black) or
# deliberately keeps (e.g. utf-8 coding headers, intentional star imports).
select = ['E4', 'E7', 'E9', 'F']

[tool.pytest.ini_options]
markers = ['integration: mark a test as an integration test.']
filterwarnings = [
    'ignore::DeprecationWarning',
    'ignore::pytest.PytestAssertRewriteWarning',
]

[tool.coverage.run]
source = ['ipyflow']
omit = [
    'ipyflow/__init__.py',
    'ipyflow/install.py',
    'ipyflow/experimental/*',
    'ipyflow/kernel/*',
    'ipyflow/types.py',
    'ipyflow/version.py',
    'ipyflow/_version.py',
]

[tool.coverage.report]
exclude_lines = [
    'pragma: no cover *$',
    '^ *if TYPE_CHECKING:',
    '^ *except',
    '^ *raise',
]
